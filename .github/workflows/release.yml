# Builds the plugin and attaches main.js, manifest.json and styles.css to a
# GitHub release whenever a version tag (like 0.4.0) is pushed.
name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/planetarium
          cp main.js manifest.json styles.css dist/planetarium/
          (cd dist && zip -r ../planetarium-${{ github.ref_name }}.zip planetarium)
          # Works whether the release was made on the website or not: create it if
          # it is missing, then attach (or replace) the files.
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
          gh release upload "${{ github.ref_name }}" --clobber \
            main.js manifest.json styles.css planetarium-${{ github.ref_name }}.zip
